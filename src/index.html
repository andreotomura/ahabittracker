<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AHA(bit) tracker</title>
  <meta name="description" content="A beautiful, local-first habit tracker that ships as a single HTML file. Your data stays yours — export/import as JSON.">
  <meta name="theme-color" content="#f4f5fb" id="theme-color">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%236d5df6%22/%3E%3Cstop offset=%22.45%22 stop-color=%22%23a855f7%22/%3E%3Cstop offset=%221%22 stop-color=%22%23ff5c8a%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22url(%23g)%22/%3E%3Cpath d=%22M23 30L13 72M23 30L33 72M16.57 57L29.43 57M40 30L40 72M60 30L60 72M40 52L60 52M77 30L67 72M77 30L87 72M70.57 57L83.43 57%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%227%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
  <!--STYLES-->
  <!--PWA-->
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"><svg class="logo-mark" viewBox="0 0 100 100"><path d="M23 30L13 72M23 30L33 72M16.57 57L29.43 57M40 30L40 72M60 30L60 72M40 52L60 52M77 30L67 72M77 30L87 72M70.57 57L83.43 57" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="brand-name">AHA<small>(bit)</small> tracker</span>
      </div>

      <nav class="tabs" id="tabs" role="tablist" aria-label="Views">
        <button class="tab active" role="tab" aria-selected="true" data-tab="today"><span class="ui-ico">☀️</span><span class="tab-label">Today</span></button>
        <button class="tab" role="tab" aria-selected="false" data-tab="calendar"><span class="ui-ico">📅</span><span class="tab-label">Calendar</span></button>
        <button class="tab" role="tab" aria-selected="false" data-tab="stats"><span class="ui-ico">📊</span><span class="tab-label">Stats</span></button>
        <button class="tab" role="tab" aria-selected="false" data-tab="habits"><span class="ui-ico">✨</span><span class="tab-label">Habits</span></button>
        <button class="tab" role="tab" aria-selected="false" data-tab="settings"><span class="ui-ico">🎨</span><span class="tab-label">Customize</span></button>
      </nav>

      <div class="actions">
        <div class="menu-wrap">
          <button id="menu-btn" class="icon-btn" aria-label="Menu" title="Menu" aria-expanded="false">⋯</button>
          <div class="menu hidden" id="menu" role="menu">
            <button role="menuitem" data-action="open-settings"><span class="ui-ico">🎨</span>Customize…</button>
            <hr>
            <button role="menuitem" data-action="export"><span class="ui-ico">⬇️</span>Export data (JSON)</button>
            <button role="menuitem" data-action="import"><span class="ui-ico">⬆️</span>Import data (JSON)</button>
            <hr>
            <button role="menuitem" data-action="about"><span class="ui-ico">ℹ️</span>About</button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section id="view-today" class="view active" role="tabpanel"></section>
      <section id="view-calendar" class="view" role="tabpanel"></section>
      <section id="view-stats" class="view" role="tabpanel"></section>
      <section id="view-habits" class="view" role="tabpanel"></section>
      <section id="view-settings" class="view" role="tabpanel"></section>
    </main>
  </div>

  <button id="fab" class="fab hidden" data-action="add" aria-label="Add habit" title="Add habit">＋</button>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <input type="file" id="import-file" accept=".json,application/json" hidden>

  <!-- Dev mode loads the files separately; `node build.js build` replaces this block with one inline script. -->
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script src="js/prefs.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
  <!--SCRIPTS-->
</body>
</html>
